[package]
name = "just-lb"
version = "0.1.0"
edition = "2024"

[dependencies]
rand = "0.10.1"
toml = "1.1.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.52", features = ["full"] }
tokio-cron-scheduler = "0.15"
reqwest = { version = "0.12", features = ["blocking", "json"] }